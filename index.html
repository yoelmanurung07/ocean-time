<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0585a4" />
  <title>Ocean Time — Simulasi Sampah di Laut</title>
  <meta name="description" content="Simulasi interaktif untuk melihat berapa lama sampah bertahan di laut." />
  <style>
:root {
  --ink: #143445;
  --ink-strong: #0b2938;
  --muted: #4a6570;
  --page: #f3fafb;
  --surface: #fff;
  --line: #d4e6eb;
  --ocean: #0585a4;
  --primary: #f97316;
  --primary-ink: #0f172a;
  --accent: #2563eb;
  --radius-panel: 24px;
  --shadow-panel: 0 12px 34px rgba(19, 71, 88, 0.08), 0 1px 3px rgba(19, 71, 88, 0.06);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 8% 0%, rgba(189, 242, 248, 0.45), transparent 31rem),
    linear-gradient(180deg, #f8fcfd 0%, var(--page) 58%, #eff8fa 100%);
  font-family: var(--font-body), "Work Sans", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #2563eb;
  outline-offset: 3px;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.app-shell {
  width: min(100%, 1440px);
  margin: 0 auto;
  padding: 20px 36px 24px;
}

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 60px;
  padding: 8px 10px 8px 14px;
  border: 1px solid rgba(205, 226, 232, 0.9);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 5px 16px rgba(28, 80, 95, 0.04);
  backdrop-filter: blur(12px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  min-width: 170px;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(145deg, #19b9cc, #087596);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.48), 0 5px 11px rgba(12, 117, 144, 0.18);
}

.brand-mark svg {
  stroke-width: 2.1;
}

.brand-copy {
  display: grid;
  gap: 2px;
}

.brand-name {
  color: var(--ink-strong);
  font-family: var(--font-heading), "Outfit", "Segoe UI", system-ui, sans-serif;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.055em;
  line-height: 1;
}

.brand-name span {
  color: #0d8da3;
}

.brand-caption {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-right: 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.status-dot,
.live-pulse,
.hint-dot,
.count-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #1ea37b;
}

.status-dot {
  box-shadow: 0 0 0 4px rgba(30, 163, 123, 0.14);
}

.icon-button,
.reset-button,
.expand-button,
.narrate-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: #2f515e;
  background: #fbfefe;
  cursor: pointer;
  transition: transform 140ms ease, color 180ms ease, background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
}

.icon-button:hover,
.reset-button:hover,
.expand-button:hover {
  border-color: #9ed0db;
  color: #075875;
  background: #eef9fb;
  box-shadow: 0 4px 10px rgba(8, 102, 129, 0.08);
}

.icon-button.is-on {
  color: #0b5d70;
  border-color: #8fd0d7;
  background: #e4f8fa;
}

.reset-button {
  gap: 8px;
  padding: 0 14px;
  font-size: 12px;
  font-weight: 600;
}

.icon-button:active,
.reset-button:active,
.expand-button:active,
.narrate-button:active,
.play-button:active,
.add-button:active,
.waste-card:active,
.speed-pill:active,
.milestone-chip:active,
.comparison-row:active {
  transform: scale(0.98);
}

/* Intro */
.intro {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  padding: 22px 2px 18px;
}

.intro-copy {
  max-width: 780px;
}

.eyebrow,
.section-kicker {
  margin: 0;
  color: #0e6f84;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
}

.eyebrow-line {
  width: 22px;
  height: 2px;
  border-radius: 10px;
  background: var(--primary);
}

.eyebrow-number {
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border: 1px solid #c3e2e8;
  border-radius: 50%;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0;
}

h1,
h2,
p {
  margin-top: 0;
}

.intro h1 {
  margin: 0;
  color: var(--ink-strong);
  font-family: var(--font-heading), "Outfit", "Segoe UI", system-ui, sans-serif;
  font-size: clamp(32px, 3.6vw, 50px);
  font-weight: 700;
  letter-spacing: -0.05em;
  line-height: 1;
}

.intro h1 span {
  color: #077b90;
}

.intro-description {
  max-width: 600px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
}

.intro-stamp {
  display: grid;
  min-width: 206px;
  gap: 6px;
  padding: 12px 15px;
  border: 1px solid #d4e8ec;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.8);
  box-shadow: 0 8px 17px rgba(26, 104, 119, 0.04);
}

.stamp-top {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.stamp-bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #194857;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.stamp-bottom svg {
  color: #117b68;
}

/* Workspace */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.52fr) minmax(320px, 0.9fr);
  align-items: stretch;
  gap: 18px;
}

.panel {
  min-width: 0;
  padding: 18px;
  border: 1px solid rgba(206, 228, 234, 0.95);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}

.simulation-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.section-kicker {
  color: var(--muted);
}

.panel-heading h2,
.controls-heading h2,
.comparison-header h2 {
  margin: 3px 0 0;
  color: var(--ink-strong);
  font-family: var(--font-heading), "Outfit", "Segoe UI", system-ui, sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.12;
}

.scene-heading-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.scene-live {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 0 11px;
  border: 1px solid #cfe8df;
  border-radius: 999px;
  color: #1f6050;
  background: #f1faf6;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.scene-live.is-active {
  border-color: #9ed9c5;
  background: #e3f7ef;
}

.live-pulse {
  width: 7px;
  height: 7px;
  background: #1ea37b;
}

.scene-live.is-active .live-pulse {
  animation: pulse 1.6s ease-in-out infinite;
}

.narrate-button {
  padding: 0;
  border-color: #d7c3f0;
  color: #5b3391;
  background: #f3ecfc;
}

.narrate-button:hover {
  border-color: #b494e0;
  color: #442173;
  background: #eadff9;
}

.narrate-button.is-speaking {
  border-color: #4f2880;
  color: #fff;
  background: #5d338f;
  box-shadow: 0 0 0 4px rgba(112, 66, 164, 0.18);
}

/* Ocean Scene */
.ocean-scene {
  position: relative;
  min-height: 360px;
  max-height: 430px;
  aspect-ratio: 1.6;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid rgba(31, 151, 175, 0.28);
  border-radius: 19px;
  color: #fff;
  background: #14afc7;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 20px rgba(7, 96, 121, 0.12);
}

.ocean-scene:fullscreen {
  width: 100vw;
  height: 100vh;
  min-height: 100vh;
  max-height: none;
  aspect-ratio: auto;
  border: 0;
  border-radius: 0;
}

.scene-exit-fullscreen {
  position: absolute;
  z-index: 15;
  top: 16px;
  right: 148px;
  border-color: rgba(255, 255, 255, 0.42);
  color: #fff;
  background: rgba(6, 56, 75, 0.72);
}

.scene-sky {
  position: absolute;
  z-index: -5;
  inset: 0 0 43%;
  background: linear-gradient(180deg, #9beafa 0%, #67d8e8 67%, #52cdda 100%);
  transition: background 450ms ease;
}

.scene-sun-glow {
  position: absolute;
  z-index: -4;
  width: 200px;
  height: 200px;
  margin-left: -100px;
  margin-top: -100px;
  border-radius: 50%;
  background: rgba(255, 245, 181, 0.28);
  filter: blur(14px);
  transition: left 180ms linear, top 180ms linear, opacity 400ms ease;
}

.celestial-body {
  position: absolute;
  z-index: -3;
  width: 48px;
  height: 48px;
  margin-left: -24px;
  margin-top: -24px;
  border-radius: 50%;
  background: radial-gradient(circle at 33% 29%, #fff9d6, #ffc864 72%);
  box-shadow: 0 0 0 8px rgba(255, 226, 153, 0.16), 0 4px 24px rgba(255, 214, 109, 0.45);
  transition: left 180ms linear, top 180ms linear, background 400ms ease;
}

.sun-rays {
  position: absolute;
  inset: -12px;
  border: 1.5px dashed rgba(255, 242, 188, 0.58);
  border-radius: 50%;
}

.is-playing .sun-rays {
  animation: slow-turn 24s linear infinite;
}

.is-night .celestial-body {
  background: transparent;
  box-shadow: 0 0 24px rgba(240, 246, 200, 0.4);
}

.celestial-body svg {
  width: 100%;
  height: 100%;
}

.scene-cloud {
  position: absolute;
  z-index: -2;
  width: 74px;
  height: 20px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.62);
  transition: opacity 400ms ease;
}

.scene-cloud::before,
.scene-cloud::after {
  position: absolute;
  bottom: 5px;
  border-radius: 50%;
  background: inherit;
  content: "";
}

.scene-cloud::before {
  left: 15px;
  width: 29px;
  height: 29px;
}

.scene-cloud::after {
  right: 13px;
  width: 23px;
  height: 23px;
}

.scene-cloud-one {
  top: 76px;
  right: 28%;
  transform: scale(0.84);
}

.scene-cloud-two {
  top: 42px;
  left: 24%;
  transform: scale(0.56);
  opacity: 0.55;
}

.scene-stars {
  position: absolute;
  z-index: -2;
  inset: 0 0 44%;
  opacity: 0;
  transition: opacity 450ms ease;
  pointer-events: none;
}

.scene-stars i {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff9cf;
  box-shadow: 0 0 9px rgba(255, 255, 225, 0.8);
}

.scene-stars i:nth-child(1) { top: 22%; left: 24%; }
.scene-stars i:nth-child(2) { top: 49%; left: 41%; width: 2px; height: 2px; }
.scene-stars i:nth-child(3) { top: 16%; left: 57%; }
.scene-stars i:nth-child(4) { top: 39%; left: 73%; width: 2px; height: 2px; }
.scene-stars i:nth-child(5) { top: 64%; left: 16%; width: 2px; height: 2px; }
.scene-stars i:nth-child(6) { top: 28%; left: 86%; }

.far-shore {
  position: absolute;
  z-index: -1;
  top: 39%;
  left: -4%;
  width: 108%;
  height: 18%;
  background: linear-gradient(180deg, rgba(61, 164, 152, 0.56), rgba(37, 126, 132, 0.56));
  clip-path: polygon(0 51%, 10% 36%, 19% 46%, 28% 18%, 36% 41%, 45% 38%, 56% 10%, 66% 40%, 78% 31%, 88% 43%, 100% 23%, 100% 100%, 0 100%);
  transition: opacity 450ms ease;
}

.scene-water {
  position: absolute;
  z-index: -1;
  inset: 44% 0 0;
  overflow: hidden;
  background: linear-gradient(180deg, #3ac3d4 0%, #14a1bf 46%, #09769d 100%);
  filter: saturate(calc(1 - var(--pollution-level, 0) * 0.35));
  transition: background 450ms ease, filter 400ms ease;
}

.water-caustics {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(112deg, transparent 15%, rgba(255, 255, 255, 0.1) 20%, transparent 25%),
    linear-gradient(108deg, transparent 48%, rgba(255, 255, 255, 0.08) 54%, transparent 60%),
    linear-gradient(115deg, transparent 74%, rgba(255, 255, 255, 0.09) 79%, transparent 84%);
  pointer-events: none;
}

.water-glimmer {
  position: absolute;
  height: 4px;
  border-radius: 100%;
  background: rgba(239, 255, 252, 0.62);
}

.water-glimmer-one { top: 24%; left: 13%; width: 11%; }
.water-glimmer-two { top: 46%; right: 17%; width: 13%; opacity: 0.48; }

.water-wave {
  position: absolute;
  left: -9%;
  width: 122%;
  height: 70px;
  border-top: 1.5px solid rgba(233, 255, 255, 0.3);
  border-radius: 50%;
}

.wave-one { top: 12%; transform: rotate(-1.4deg); }
.wave-two { top: 46%; transform: rotate(1.2deg); opacity: 0.48; }

.water-bubbles i {
  position: absolute;
  bottom: 14%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid rgba(225, 252, 255, 0.55);
  background: rgba(225, 252, 255, 0.16);
}

.water-bubbles i:nth-child(1) { left: 18%; animation: bubble-rise 6s linear infinite; }
.water-bubbles i:nth-child(2) { left: 37%; width: 5px; height: 5px; animation: bubble-rise 7.5s linear infinite -2s; }
.water-bubbles i:nth-child(3) { left: 59%; animation: bubble-rise 5.8s linear infinite -3.5s; }
.water-bubbles i:nth-child(4) { left: 74%; width: 6px; height: 6px; animation: bubble-rise 8s linear infinite -1s; }
.water-bubbles i:nth-child(5) { left: 86%; width: 4px; height: 4px; animation: bubble-rise 6.5s linear infinite -4s; }

.scene-depth {
  position: absolute;
  z-index: 0;
  right: 0;
  bottom: 0;
  left: 0;
  height: 56%;
  background: linear-gradient(180deg, transparent 3%, rgba(0, 68, 99, 0.08) 52%, rgba(3, 55, 81, 0.34) 100%);
  pointer-events: none;
}

.sea-floor {
  position: absolute;
  z-index: 2;
  right: -7%;
  bottom: -26%;
  left: -8%;
  height: 42%;
  border-radius: 52% 48% 0 0 / 20% 23% 0 0;
  background:
    radial-gradient(ellipse at 36% 8%, rgba(255, 219, 158, 0.48), transparent 25%),
    linear-gradient(180deg, #dfbf84 0%, #b99764 42%, #7b7354 100%);
}

.coral-reef {
  position: absolute;
  z-index: 3;
  bottom: 10%;
  left: 44%;
  width: 72px;
  height: 44px;
  pointer-events: none;
}

.coral-reef i {
  position: absolute;
  bottom: 0;
  width: 10px;
  border-radius: 8px 8px 2px 2px;
  background: #eb937c;
}

.coral-reef i:nth-child(1) { left: 10px; height: 28px; transform: rotate(-16deg); }
.coral-reef i:nth-child(2) { left: 26px; height: 38px; background: #f2a988; }
.coral-reef i:nth-child(3) { left: 42px; height: 24px; transform: rotate(18deg); background: #d97c6b; }

.seaweed {
  position: absolute;
  z-index: 4;
  bottom: 11%;
  width: 68px;
  height: 98px;
  pointer-events: none;
}

.seaweed-left { left: 2%; transform: rotate(-7deg); }
.seaweed-right { right: 2%; width: 58px; height: 76px; transform: scaleX(-1) rotate(-7deg); }

.seaweed i {
  position: absolute;
  bottom: 0;
  left: 28px;
  width: 11px;
  height: 76px;
  border-radius: 90% 0 90% 0;
  background: linear-gradient(90deg, #2c8c7a, #46ad87);
  transform-origin: bottom center;
  animation: sway 4.2s ease-in-out infinite alternate;
}

.seaweed i:nth-child(1) { height: 88px; transform: rotate(-22deg); }
.seaweed i:nth-child(2) { height: 68px; transform: rotate(18deg); animation-delay: -1.8s; }
.seaweed i:nth-child(3) { height: 52px; width: 9px; transform: rotate(2deg); animation-delay: -0.9s; }

.scene-fish {
  position: absolute;
  z-index: 3;
  width: 60px;
  height: 29px;
  color: rgba(242, 255, 246, 0.78);
  filter: drop-shadow(0 4px 4px rgba(0, 73, 91, 0.14));
  animation: fish-drift 7s ease-in-out infinite alternate;
}

.scene-fish-one { top: 68%; left: 22%; }
.scene-fish-two { top: 56%; left: 72%; width: 44px; height: 21px; opacity: 0.58; animation-delay: -3s; }

/* Twilight & Night */
.is-twilight .scene-sky {
  background: linear-gradient(180deg, #4b6594 0%, #c87b6f 58%, #f2b47c 100%);
}

.is-night .scene-sky {
  background: linear-gradient(180deg, #133154 0%, #245d82 72%, #298199 100%);
}

.is-night .scene-sun-glow {
  opacity: 0;
}

.is-night .scene-cloud {
  opacity: 0.22;
}

.is-night .scene-stars {
  opacity: 1;
}

.is-night .far-shore {
  opacity: 0.55;
}

.is-night .scene-water {
  background: linear-gradient(180deg, #25718b 0%, #105575 54%, #073356 100%);
}

/* FlipClock & Scene HUD */
.scene-time-card,
.scene-phase-pill,
.scene-object-count {
  position: absolute;
  z-index: 12;
  backdrop-filter: blur(9px);
}

.scene-time-card {
  top: 14px;
  left: 14px;
  display: grid;
  gap: 5px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.36);
  border-radius: 14px;
  background: rgba(6, 51, 70, 0.78);
  box-shadow: 0 8px 22px rgba(6, 55, 76, 0.18);
}

.scene-time-label {
  color: rgba(230, 250, 251, 0.9);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.flip-clock {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.flip-digits {
  display: inline-flex;
  gap: 3px;
  perspective: 360px;
}

.flip-tile {
  position: relative;
  display: grid;
  width: 24px;
  height: 32px;
  place-items: center;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: linear-gradient(180deg, #104e68 0%, #0a3c52 49%, #0d465f 51%, #073042 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 6px rgba(0, 24, 36, 0.3);
  font-family: var(--font-heading), "Outfit", sans-serif;
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #fff;
  animation: flip-down 200ms ease-out;
}

.flip-tile::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: rgba(0, 18, 28, 0.55);
}

.flip-unit {
  color: #cff4f6;
  font-size: 12px;
  font-weight: 700;
}

.scene-time-progress {
  height: 4px;
  overflow: hidden;
  border-radius: 5px;
  background: rgba(221, 249, 248, 0.26);
}

.scene-time-progress i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #65e4d2, #ffcb6b);
  transition: width 120ms linear;
}

.scene-phase-pill {
  top: 14px;
  right: 14px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, 0.38);
  border-radius: 999px;
  color: #fff;
  background: rgba(7, 62, 82, 0.68);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.scene-phase-pill svg {
  color: #ffe8a3;
}

.scene-object-count {
  right: 14px;
  bottom: 14px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 32px;
  padding: 0 11px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 999px;
  color: #f4ffff;
  background: rgba(5, 53, 72, 0.68);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.count-dot {
  width: 6px;
  height: 6px;
  background: #ffbd67;
  box-shadow: 0 0 0 3px rgba(255, 189, 103, 0.2);
}

.scene-empty-prompt {
  position: absolute;
  z-index: 8;
  top: 52%;
  left: 50%;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 10px 14px 10px 10px;
  border: 1px solid rgba(230, 255, 255, 0.42);
  border-radius: 14px;
  color: #f4ffff;
  background: rgba(4, 68, 90, 0.64);
  box-shadow: 0 8px 18px rgba(5, 72, 93, 0.16);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.35;
  transform: translate(-50%, -50%);
}

.prompt-spark {
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  color: #0c5268;
  background: #e9ffff;
}

/* Illustrated Floating Waste & 4-Stage Decay */
.floating-waste {
  position: absolute;
  display: grid;
  place-items: center;
  opacity: var(--waste-opacity, 1);
  transform: rotate(var(--waste-rot, 0deg));
  filter: drop-shadow(0 6px 8px rgba(4, 42, 58, 0.28));
  animation: float-waste 4.4s ease-in-out infinite;
  transition: opacity 350ms ease, filter 350ms ease;
  pointer-events: none;
}

.floating-waste.buoyancy-sink {
  animation: sink-rest 5.5s ease-in-out infinite;
}

.floating-waste.is-entering {
  animation: waste-drop 650ms cubic-bezier(0.22, 0.85, 0.32, 1.1) both;
}

.floating-waste svg {
  width: 100%;
  height: 100%;
}

.floating-waste.stage-weathered {
  filter: drop-shadow(0 5px 7px rgba(4, 42, 58, 0.24)) saturate(0.82) sepia(0.18);
}

.floating-waste.stage-fragmenting {
  filter: drop-shadow(0 3px 5px rgba(4, 42, 58, 0.2)) saturate(0.6) contrast(0.95);
  transform: rotate(var(--waste-rot, 0deg)) scale(0.86);
}

.floating-waste.stage-microplastic {
  filter: saturate(0.55) blur(0.4px);
  transform: rotate(var(--waste-rot, 0deg)) scale(0.62);
}

.floating-waste.stage-dissolved {
  filter: grayscale(0.8) blur(1px);
  transform: rotate(var(--waste-rot, 0deg)) scale(0.42);
}

.water-splash {
  position: absolute;
  inset: -6px;
  border: 2px solid rgba(232, 253, 255, 0.85);
  border-radius: 50%;
  animation: splash-ring 680ms ease-out forwards;
}

.microplastic-specks i {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 4px rgba(14, 118, 146, 0.5);
}

.microplastic-specks i:nth-child(1) { top: -8px; left: 4px; }
.microplastic-specks i:nth-child(2) { bottom: -6px; right: 2px; }
.microplastic-specks i:nth-child(3) { top: 50%; left: -10px; }

.scene-caption {
  position: absolute;
  z-index: 11;
  bottom: 15px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: rgba(244, 255, 255, 0.94);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-shadow: 0 1px 5px rgba(3, 52, 71, 0.55);
}

.scene-caption i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffcf75;
}

/* Timeline Controls */
.timeline-controls {
  display: grid;
  gap: 10px;
  padding: 2px 2px 0;
}

.timeline-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.timeline-label-group {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.timeline-icon {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid #d4e8ec;
  border-radius: 11px;
  color: #0e788d;
  background: #f0fafb;
}

.timeline-readout {
  display: block;
  margin-top: 2px;
  color: #2f4d58;
  font-size: 13px;
}

.timeline-readout strong {
  color: var(--ink-strong);
  font-family: var(--font-heading), "Outfit", sans-serif;
  font-size: 17px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.timeline-readout small {
  font-size: 12px;
}

.timeline-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.speed-group {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #f4fafb;
  gap: 3px;
}

.speed-pill {
  min-width: 44px;
  min-height: 44px;
  padding: 0 10px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.speed-pill.is-active {
  background: #0e7b90;
  color: #fff;
}

.play-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid #1b63d2;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(180deg, #3778ed, #225bc4);
  box-shadow: 0 6px 13px rgba(37, 99, 235, 0.2);
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.play-button:hover {
  filter: brightness(1.06);
}

.play-button.is-idle {
  border-color: #c2d4e0;
  color: #2e4852;
  background: #e9f1f6;
  box-shadow: none;
}

.play-button.is-idle:hover {
  filter: none;
  background: #dfeaf1;
}

.play-button.is-running {
  border-color: #0d6c73;
  background: linear-gradient(180deg, #148b8c, #0f6c7a);
}

.status-notice {
  margin: 0;
  padding: 9px 12px;
  border: 1px solid #d4e8ec;
  border-radius: 11px;
  color: #1c4755;
  background: #f2fafb;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
}

.range-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}

.time-range {
  width: 100%;
  height: 44px;
  margin: -6px 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.time-range:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

.time-range::-webkit-slider-runnable-track {
  height: 7px;
  border: 1px solid #d4e6eb;
  border-radius: 10px;
  background: linear-gradient(90deg, #13afbd 0%, #47cfca 48%, #f2bd67 100%);
}

.time-range::-moz-range-track {
  height: 7px;
  border: 1px solid #d4e6eb;
  border-radius: 10px;
  background: linear-gradient(90deg, #13afbd 0%, #47cfca 48%, #f2bd67 100%);
}

.time-range::-webkit-slider-thumb {
  width: 20px;
  height: 20px;
  margin-top: -7px;
  appearance: none;
  border: 3px solid #fff;
  border-radius: 50%;
  background: #087ca1;
  box-shadow: 0 0 0 1px #087ca1, 0 2px 6px rgba(8, 67, 92, 0.3);
}

.time-range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 3px solid #fff;
  border-radius: 50%;
  background: #087ca1;
  box-shadow: 0 0 0 1px #087ca1, 0 2px 6px rgba(8, 67, 92, 0.3);
}

.milestone-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.milestone-chip {
  min-width: 44px;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid #d4e6eb;
  border-radius: 999px;
  background: #f6fbfc;
  color: #2f515e;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.milestone-chip:hover:not(:disabled) {
  border-color: #8bc7d4;
  background: #e8f7fa;
}

.milestone-chip.is-active {
  border-color: #0e7b90;
  color: #fff;
  background: #0e7b90;
}

.milestone-chip:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Controls Panel */
.controls-panel {
  display: flex;
  flex-direction: column;
  padding: 20px;
}

.controls-heading h2 {
  margin-top: 6px;
  font-size: 24px;
}

.controls-heading > p:last-child {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.waste-list {
  display: grid;
  gap: 8px;
  margin-top: 14px;
}

.waste-card {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto 28px;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  padding: 8px 10px;
  border: 1.5px solid #dfecee;
  border-radius: 14px;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
  text-align: left;
  transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease, transform 140ms ease;
}

.waste-card:hover {
  border-color: #a9d9e0;
  background: #fbfeff;
}

.waste-card.is-selected {
  border-color: var(--waste-color);
  background: linear-gradient(100deg, var(--waste-tint), #fff 78%);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--waste-color) 14%, transparent);
}

.waste-card-icon {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 11px;
  background: var(--waste-tint);
  padding: 5px;
}

.waste-card-icon svg {
  width: 100%;
  height: 100%;
}

.waste-card-copy {
  display: grid;
  min-width: 0;
  gap: 2px;
}

.waste-card-copy strong {
  color: #1a3b48;
  font-size: 13px;
  font-weight: 700;
}

.waste-card-copy small {
  color: var(--muted);
  font-size: 11px;
}

.waste-duration {
  color: #2f515e;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.waste-card-arrow {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 1px solid #dfebed;
  border-radius: 9px;
  color: #4a6570;
  background: #f8fcfd;
}

.waste-card.is-selected .waste-card-arrow {
  border-color: transparent;
  color: #fff;
  background: var(--waste-color);
}

.lifespan-card {
  margin-top: 14px;
  padding: 14px;
  border: 1px solid #d9eaec;
  border-radius: 15px;
  background: linear-gradient(145deg, #f8fcfc, #f1f8f8);
}

.lifespan-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.13em;
}

.lifespan-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lifespan-mark {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 10px;
  color: #137665;
  background: #dff3eb;
}

.lifespan-headline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.lifespan-headline strong {
  color: #0e4e5e;
  font-family: var(--font-heading), "Outfit", sans-serif;
  font-size: 20px;
  font-weight: 700;
}

.lifespan-card > p {
  margin: 6px 0 11px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.48;
}

.lifespan-progress {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: #d8e9e8;
}

.lifespan-progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #16a9a1, #55cba1, #efb851);
  transition: width 150ms linear;
}

.lifespan-progress-caption {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}

.add-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 48px;
  margin-top: 12px;
  padding: 0 14px;
  border: 1px solid #f08a35;
  border-radius: 13px;
  color: var(--primary-ink);
  background: linear-gradient(180deg, #ffad53, #f9892e);
  box-shadow: 0 6px 13px rgba(236, 126, 42, 0.2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
}

.add-button:hover:not(:disabled) {
  filter: saturate(1.06) brightness(1.02);
}

.add-button:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  filter: grayscale(0.2);
  box-shadow: none;
}

.add-button-icon {
  display: grid;
  width: 28px;
  height: 28px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 9px;
  background: rgba(255, 243, 211, 0.45);
}

.add-button > span:nth-child(2) {
  flex: 1;
  text-align: left;
}

.selection-hint {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 10px 2px 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}

.hint-dot {
  width: 6px;
  height: 6px;
  background: #14917c;
}

/* Comparison Board */
.comparison-board {
  margin-top: 18px;
}

.comparison-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.comparison-scale-legend {
  display: flex;
  gap: 14px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.comparison-list {
  display: grid;
  gap: 8px;
}

.comparison-row {
  display: grid;
  grid-template-columns: minmax(190px, 240px) minmax(0, 1fr) 114px;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #dfecee;
  border-radius: 14px;
  background: #fbfefe;
  text-align: left;
  cursor: pointer;
  transition: border-color 160ms ease, background-color 160ms ease;
}

.comparison-row:hover {
  border-color: #9fd1db;
  background: #f4fbfd;
}

.comparison-row.is-selected {
  border-color: var(--waste-color);
  background: linear-gradient(95deg, var(--waste-tint), #fff 70%);
}

.comparison-item {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.comparison-thumb {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  padding: 4px;
  border-radius: 9px;
  background: var(--waste-tint);
}

.comparison-thumb svg {
  width: 100%;
  height: 100%;
}

.comparison-copy {
  display: grid;
  min-width: 0;
}

.comparison-copy strong {
  color: var(--ink-strong);
  font-size: 13px;
  font-weight: 700;
}

.comparison-copy small {
  color: var(--muted);
  font-size: 11px;
}

.comparison-bar-track {
  position: relative;
  height: 10px;
  border-radius: 999px;
  background: #e3eff1;
  overflow: visible;
}

.comparison-bar-fill {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--waste-color);
  opacity: 0.85;
}

.comparison-bar-marker {
  position: absolute;
  top: -3px;
  width: 3px;
  height: 16px;
  border-radius: 2px;
  background: #0b2938;
  transform: translateX(-50%);
}

.stage-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.stage-pill.stage-intact { color: #12586c; background: #dff4f8; }
.stage-pill.stage-weathered { color: #7a4c09; background: #fef0d3; }
.stage-pill.stage-fragmenting { color: #8c3d15; background: #fde6d8; }
.stage-pill.stage-microplastic { color: #8a1f2d; background: #fce2e6; }
.stage-pill.stage-dissolved { color: #14634b; background: #daf5ea; }

/* Footer */
.site-footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 4px 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.site-footer > span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.site-footer i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #e99646;
}

.footer-motto {
  font-weight: 600;
  letter-spacing: 0.01em;
}

/* Animations */
@keyframes float-waste {
  0%, 100% { transform: rotate(var(--waste-rot, 0deg)) translateY(0); }
  50% { transform: rotate(var(--waste-rot, 0deg)) translateY(-6px); }
}

@keyframes sink-rest {
  0%, 100% { transform: rotate(var(--waste-rot, 0deg)) translateY(0); }
  50% { transform: rotate(var(--waste-rot, 0deg)) translateY(-2px); }
}

@keyframes waste-drop {
  0% { opacity: 0; transform: translateY(-140px) rotate(-18deg) scale(0.82); }
  65% { opacity: 1; transform: translateY(8px) rotate(var(--waste-rot, 0deg)) scale(1.04); }
  100% { opacity: var(--waste-opacity, 1); transform: translateY(0) rotate(var(--waste-rot, 0deg)) scale(1); }
}

@keyframes splash-ring {
  0% { opacity: 0.9; transform: scale(0.5); }
  100% { opacity: 0; transform: scale(1.9); }
}

@keyframes flip-down {
  0% { transform: rotateX(-55deg); }
  100% { transform: rotateX(0deg); }
}

@keyframes bubble-rise {
  0% { transform: translateY(0) scale(0.8); opacity: 0; }
  20% { opacity: 0.7; }
  100% { transform: translateY(-130px) scale(1.1); opacity: 0; }
}

@keyframes sway {
  to { transform: rotate(10deg); }
}

@keyframes fish-drift {
  from { transform: translateX(-6px) translateY(0); }
  to { transform: translateX(16px) translateY(-6px); }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(30, 163, 123, 0.14); }
  50% { box-shadow: 0 0 0 6px rgba(30, 163, 123, 0.06); }
}

@keyframes slow-turn {
  to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 1080px) {
  .app-shell { padding: 18px 22px 22px; }
  .workspace { grid-template-columns: 1fr; }
  .ocean-scene { max-height: 400px; }
  .controls-heading h2 br { display: none; }
  .waste-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .waste-list .waste-card:last-child { grid-column: 1 / -1; }
}

@media (max-width: 640px) {
  .comparison-row {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px 12px;
  }
  .comparison-bar-track {
    grid-column: 1 / -1;
    order: 3;
  }
  .comparison-scale-legend { display: none; }
}

@media (max-width: 580px) {
  .app-shell { padding: 12px 14px 18px; }
  .topbar { min-height: 56px; padding: 6px 8px 6px 10px; border-radius: 15px; }
  .brand { min-width: 0; gap: 8px; }
  .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
  .brand-name { font-size: 18px; }
  .topbar-label { display: none; }
  .reset-button { gap: 0; padding: 0; }
  .reset-button span { display: none; }
  .intro { display: block; padding: 16px 2px 14px; }
  .desktop-break, .intro-stamp { display: none; }
  .intro-description { margin-top: 8px; font-size: 13px; }
  .panel { padding: 14px; border-radius: 20px; }
  .panel-heading h2 { font-size: 19px; }
  .scene-live { padding: 0 9px; min-height: 32px; }
  .ocean-scene { min-height: 275px; max-height: 295px; aspect-ratio: auto; border-radius: 16px; }
  .scene-time-card { top: 10px; left: 10px; padding: 8px 10px; border-radius: 12px; }
  .flip-tile { width: 20px; height: 28px; font-size: 17px; }
  .scene-phase-pill { top: 10px; right: 10px; min-height: 32px; padding: 0 10px; }
  .scene-object-count { right: 10px; bottom: 10px; min-height: 28px; }
  .scene-caption { bottom: 12px; left: 12px; }
  .scene-caption span, .scene-caption i { display: none; }
  .timeline-topline { align-items: flex-end; }
  .waste-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .waste-card {
    grid-template-columns: 34px minmax(0, 1fr);
    grid-template-rows: auto auto;
    gap: 6px 8px;
    min-height: 82px;
    padding: 9px;
  }
  .waste-card-icon { width: 34px; height: 34px; grid-column: 1; grid-row: 1; }
  .waste-duration { grid-column: 2; grid-row: 1; justify-self: end; align-self: center; }
  .waste-card-copy { grid-column: 1 / -1; grid-row: 2; }
  .waste-card-copy strong { font-size: 12px; line-height: 1.25; }
  .waste-card-copy small { font-size: 10px; }
  .waste-card-arrow { display: none; }
  .waste-list .waste-card:last-child {
    grid-column: 1 / -1;
    grid-template-columns: 38px minmax(0, 1fr) auto;
    grid-template-rows: auto;
    min-height: 62px;
  }
  .waste-list .waste-card:last-child .waste-card-icon { grid-column: 1; grid-row: 1; width: 38px; height: 38px; }
  .waste-list .waste-card:last-child .waste-card-copy { grid-column: 2; grid-row: 1; }
  .waste-list .waste-card:last-child .waste-duration { grid-column: 3; grid-row: 1; }
  .site-footer { flex-direction: column; gap: 6px; padding-top: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const MAX_SIM_YEARS = 500;

    const WASTE_TYPES = [

      {

        durationYears: 20,
        durationLabel: "sekitar 20 tahun",
        shortDuration: "20 thn",
        buoyancy: "midwater",
        endMode: "microplastic",
        color: "#c75a24",
        tint: "#fff0e4",
        fact: "Kantong plastik melayang seperti ubur-ubur dan pecah menjadi mikroplastik dalam sekitar 20 tahun.",

        endMode: "microplastic",
        color: "#0e7692",
        tint: "#dff7fa",
        fact: "Botol plastik PET dapat bertahan di laut hingga sekitar 450 tahun sebelum menjadi serpihan kecil.",
      },
      {
        id: "can",
        name: "Kaleng aluminium",
        material: "Logam aluminium",
        durationYears: 500,
        durationLabel: "hingga 500 tahun",
        shortDuration: "500 thn",
        buoyancy: "sink",
        endMode: "dissolve",
        color: "#5557a6",
        tint: "#efefff",
        fact: "Kaleng aluminium tenggelam ke dasar laut dan butuh hingga 500 tahun untuk berkarat dan hancur.",
      },
      {
        id: "foam",
        name: "Styrofoam",
        material: "Busa polistirena",
        durationYears: 9999,
        durationLabel: "sangat lama (>500 thn)",
        shortDuration: ">500 thn",
        buoyancy: "surface",
        endMode: "microplastic",
        color: "#436b5d",
        tint: "#eaf5f0",

    const MILESTONES = [
      { label: "0", years: 0 },
      { label: "3 bln", years: 0.25 },
      { label: "20 thn", years: 20 },
      { label: "100 thn", years: 100 },
      { label: "450 thn", years: 450 },
      { label: "500 thn", years: 500 },
    ];

    const SPEED_OPTIONS = [
      { value: 1, label: "1x" },
      { value: 3, label: "3x" },
      { value: 5, label: "5x" },
    ];

    const SEGMENTS = [
      { t0: 0, t1: 250, y0: 0, y1: 1 },
      { t0: 250, t1: 500, y0: 1, y1: 20 },
      { t0: 500, t1: 750, y0: 20, y1: 100 },
      { t0: 750, t1: 1000, y0: 100, y1: 500 },
    ];

    const ZONE_POSITIONS = {
      surface: [
        { left: 12, bottom: 53, rotation: -8 },
        { left: 28, bottom: 55, rotation: 6 },
        { left: 45, bottom: 52, rotation: -5 },
        { left: 62, bottom: 54, rotation: 9 },
        { left: 78, bottom: 53, rotation: -7 },
        { left: 88, bottom: 55, rotation: 5 },
      ],
      midwater: [
        { left: 16, bottom: 38, rotation: -12 },
        { left: 34, bottom: 33, rotation: 10 },
        { left: 52, bottom: 41, rotation: -6 },
        { left: 68, bottom: 35, rotation: 13 },
        { left: 83, bottom: 39, rotation: -9 },
        { left: 24, bottom: 44, rotation: 7 },
      ],
      sink: [
        { left: 14, bottom: 18, rotation: -14 },
        { left: 30, bottom: 15, rotation: 9 },
        { left: 48, bottom: 19, rotation: -7 },
        { left: 65, bottom: 16, rotation: 12 },
        { left: 80, bottom: 18, rotation: -10 },
        { left: 39, bottom: 14, rotation: 6 },
      ],
    };

    function tickToYears(tick) {
      const clamped = Math.max(0, Math.min(MAX_TICK, tick));
      for (const seg of SEGMENTS) {
        if (clamped <= seg.t1) {
          const ratio = (clamped - seg.t0) / (seg.t1 - seg.t0);
          return seg.y0 + ratio * (seg.y1 - seg.y0);
        }
      }
      return MAX_SIM_YEARS;
    }

    function yearsToTick(years) {
      const clamped = Math.max(0, Math.min(MAX_SIM_YEARS, years));
      for (const seg of SEGMENTS) {
        if (clamped <= seg.y1) {
          const ratio = (clamped - seg.y0) / (seg.y1 - seg.y0);
          return seg.t0 + ratio * (seg.t1 - seg.t0);
        }
      }
      return MAX_TICK;
    }

    function formatSimTime(years) {
      if (years < 1) {
        const months = Math.round(years * 12);
        return {
          value: String(months),
          padded: String(months).padStart(3, "0"),
          unit: "bln",
          longUnit: "bulan",
          prefix: "Bulan ke",
        };
      }
      const rounded = Math.round(years);
      return {
        value: String(rounded),
        padded: String(rounded).padStart(3, "0"),
        unit: "thn",
        longUnit: "tahun",
        prefix: "Tahun ke",
      };
    }

    function getDecayStage(decay, wasteType) {
      if (decay < 0.25) return { key: "intact", label: "Masih utuh", tone: "intact" };
      if (decay < 0.65) return { key: "weathered", label: "Mulai rapuh", tone: "weathered" };
      if (decay < 1) return { key: "fragmenting", label: "Terpecah", tone: "fragmenting" };
      if (wasteType.endMode === "microplastic") return { key: "microplastic", label: "Mikroplastik", tone: "microplastic" };
      return { key: "dissolved", label: "Terurai", tone: "dissolved" };
    }

    function iconSvg(name, size = 18) {
      const a = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"`;
      switch (name) {
        case "wave":
          return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13c3.2 0 3.2-3.5 6.4-3.5S12.6 13 15.8 13s3.2-3.5 6.4-3.5 3.2 3.5 6.4 3.5"/><path d="M3 20c3.2 0 3.2-3.5 6.4-3.5S12.6 20 15.8 20s3.2-3.5 6.4-3.5 3.2 3.5 6.4 3.5"/></svg>`;
        case "sound":
          return `<svg ${a}><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
        case "soundOff":
          return `<svg ${a}><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/></svg>`;
        case "reset":
          return `<svg ${a}><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></svg>`;
        case "play":
          return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.9c0-.78.85-1.26 1.52-.86l9.15 5.47a1.72 1.72 0 0 1 0 2.96l-9.15 5.47A1 1 0 0 1 8 18.08V5.9Z"/></svg>`;
        case "pause":
          return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.4" height="14" rx="1.4"/><rect x="13.6" y="5" width="4.4" height="14" rx="1.4"/></svg>`;
        case "plus":
          return `<svg ${a}><path d="M12 5v14M5 12h14"/></svg>`;
        case "sun":
          return `<svg ${a}><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`;
        case "moon":
          return `<svg ${a}><path d="M20.2 15.5A8.4 8.4 0 0 1 8.5 3.8 8.5 8.5 0 1 0 20.2 15.5Z"/><path d="m17 4 .5 1.5L19 6l-1.5.5L17 8l-.5-1.5L15 6l1.5-.5L17 4Z"/></svg>`;
        case "arrow":
          return `<svg ${a}><path d="M5 12h14m-6-6 6 6-6 6"/></svg>`;
        case "expand":
          return `<svg ${a}><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>`;
        case "shrink":
          return `<svg ${a}><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>`;
        case "leaf":
          return `<svg ${a}><path d="M20 4c-7.2 0-12.3 2.3-14.5 6.4-1.5 2.8-.4 6.2 2.4 7.4 4.3 1.9 9.1-1.8 10.9-7.8.5-1.7.9-3.4 1.2-6Z"/><path d="M5 21c2.2-4.4 5.6-7.5 10.5-10"/></svg>`;
        default:
          return "";
      }
    }

    function wasteSvg(type) {
      if (type === "bottle") {
        return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="20" y="3.5" width="8" height="4" rx="1.2" fill="#0d6984"/><path d="M20 7.5h8v3.5l3.5 4.4V39a4 4 0 0 1-4 4h-7a4 4 0 0 1-4-4V15.4L20 11V7.5Z" fill="#bceef7" stroke="#0e7692" stroke-width="2" stroke-linejoin="round"/><rect x="16.8" y="21" width="14.4" height="9" rx="1.5" fill="#0e86a4" fill-opacity="0.82"/><path d="M19.5 16v18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.78"/><path d="M17.5 34.5h13" stroke="#0e7692" stroke-width="1.4" stroke-opacity="0.45"/></svg>`;
      }
      if (type === "bag") {
        return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M15 16v-4a4.5 4.5 0 0 1 9 0v4m0-4a4.5 4.5 0 0 1 9 0v4" stroke="#c75a24" stroke-width="2.3" stroke-linecap="round"/><path d="M11 16h26l-2.3 24.5a2.5 2.5 0 0 1-2.5 2.3H15.8a2.5 2.5 0 0 1-2.5-2.3L11 16Z" fill="#ffd9c4" fill-opacity="0.92" stroke="#c75a24" stroke-width="2" stroke-linejoin="round"/><path d="M17 22c1 5 0 10-1 14m15-14c-1 5 0 10 1 14" stroke="#e07b42" stroke-width="1.8" stroke-linecap="round"/><path d="M20 27c2.5 1.8 5.5 1.8 8 0" stroke="#c75a24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.55"/></svg>`;
      }
      if (type === "can") {
        return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="15" y="8.5" width="18" height="32" rx="4.5" fill="#d7d9f2" stroke="#4d4f9c" stroke-width="2"/><ellipse cx="24" cy="9.5" rx="9" ry="2.6" fill="#eef0ff" stroke="#4d4f9c" stroke-width="1.8"/><rect x="15.5" y="18" width="17" height="11" fill="#6366ba" fill-opacity="0.86"/><path d="M19 14v21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.65"/><path d="M15.5 36.5c2.5 1.3 14.5 1.3 17 0" stroke="#4d4f9c" stroke-width="1.6" stroke-opacity="0.55"/></svg>`;
      }
      if (type === "paper") {
        return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="m8 17.5 14-8.5 18 7.5-14 9-18-8Z" fill="#e6c89d" stroke="#7a4e2c" stroke-width="2" stroke-linejoin="round"/><path d="M8 17.5V32l18 8.5V25.5l-18-8Z" fill="#c79e6b" stroke="#7a4e2c" stroke-width="2" stroke-linejoin="round"/><path d="M40 16.5V31L26 40.5v-15l14-9Z" fill="#b18552" stroke="#7a4e2c" stroke-width="2" stroke-linejoin="round"/><path d="m14.5 13.5 17 7.2" stroke="#7a4e2c" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/><path d="M12 24.5l9 4" stroke="#f7e8d0" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/></svg>`;
      }
      return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M11 16.5c0-2.5 2.2-4.5 5-4.5h16c2.8 0 5 2 5 4.5l-1.5 16.5a3.5 3.5 0 0 1-3.5 3.2H16a3.5 3.5 0 0 1-3.5-3.2L11 16.5Z" fill="#f2f7f4" stroke="#436b5d" stroke-width="2" stroke-linejoin="round"/><path d="M12.5 22.5h23" stroke="#79a192" stroke-width="1.7"/><circle cx="19" cy="28" r="1.4" fill="#6b9384"/><circle cx="25" cy="30.5" r="1.6" fill="#6b9384"/><circle cx="29.5" cy="27" r="1.3" fill="#6b9384"/><circle cx="22.5" cy="17.5" r="1.3" fill="#6b9384"/></svg>`;
    }

    function fishSvg(cls) {
      return `<svg class="${cls}" viewBox="0 0 100 48" fill="none" aria-hidden="true"><path d="M13 24C25 9 50 7 72 20l17-10v28L72 28C50 41 25 39 13 24Z" fill="currentColor"/><circle cx="34" cy="21" r="2.5" fill="#0b5c70"/><path d="M50 14c-3 6-3 14 0 20m12-16c-2 4-2 8 0 12" stroke="#fff" stroke-opacity=".65" stroke-width="2"/></svg>`;
    }

    const moonSvg = `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M34.5 29.8A14.5 14.5 0 0 1 18.2 13.5c0-2.6.7-5 1.9-7.1A15.5 15.5 0 1 0 41.6 27.9c-2.1 1.2-4.5 1.9-7.1 1.9Z" fill="#fff5c0"/></svg>`;

    const state = {
      selectedId: "bottle",
      simYears: 0,
      isRunning: false,
      speed: 1,
      soundEnabled: false,
      speakingId: null,
      isFullscreen: false,
      debris: [],
      notice: "Pilih jenis sampah untuk menjatuhkannya ke laut.",
      nextId: 0,
      rafId: 0,
      audioSession: 0,
      fadeTimeout: null,
      splashTimeout: null,
      speechToken: 0,
      audio: { context: null, source: null, gain: null },
    };

    function render() {
      const selected = WASTE_TYPES.find((item) => item.id === state.selectedId) || WASTE_TYPES[0];
      const sliderTick = yearsToTick(state.simYears);
      const formattedTime = formatSimTime(state.simYears);
      const timelineProgress = (sliderTick / MAX_TICK) * 100;
      const cyclePhase = (sliderTick % 250) / 250;
      const isNight = cyclePhase >= 0.44 && cyclePhase < 0.9;
      const isTwilight = (cyclePhase >= 0.34 && cyclePhase < 0.48) || (cyclePhase >= 0.84 && cyclePhase < 0.96);
      const sunArcProgress = isNight ? 1 : Math.min(1, cyclePhase / 0.44);
      const sunLeft = 18 + sunArcProgress * 64;
      const sunTop = 34 - Math.sin(sunArcProgress * Math.PI) * 24;

      const selectedItems = state.debris.filter((item) => item.type === selected.id);
      const matchingCount = selectedItems.length;
      const oldestSelectedAge = selectedItems.reduce(
        (maxAge, item) => Math.max(maxAge, Math.max(0, state.simYears - item.addedAtYears)),
        Math.max(0, state.simYears)
      );
      const selectedDecay = Math.min(1, oldestSelectedAge / selected.durationYears);
      const selectedStage = getDecayStage(selectedDecay, selected);
      const hasReachedEnd = state.simYears >= MAX_SIM_YEARS;
      const pollutionLevel = Math.min(1, state.debris.length / MAX_DEBRIS);

      const insightText =
        selectedItems.length > 0 && selectedDecay >= 1
          ? selected.endMode === "microplastic"
            ? `${selected.name} sudah pecah menjadi mikroplastik yang tetap mencemari laut (${selected.durationLabel}).`
            : `${selected.name} telah mencapai perkiraan waktu urainya (${selected.durationLabel}).`
          : selected.fact;

      const digitsHtml = formattedTime.padded
        .split("")
        .map((d) => `<span class="flip-tile"><span class="flip-tile-value">${d}</span></span>`)
        .join("");

      const debrisHtml = state.debris
        .map((item, index) => {
          const itemType = WASTE_TYPES.find((w) => w.id === item.type) || WASTE_TYPES[0];
          const itemAge = Math.max(0, state.simYears - item.addedAtYears);
          const decay = Math.min(1, itemAge / itemType.durationYears);
          const stage = getDecayStage(decay, itemType);
          const opacity =
            stage.key === "dissolved"
              ? 0.08
              : stage.key === "microplastic"
              ? 0.42
              : Math.max(0.45, 1 - decay * 0.45);
          return `<div class="floating-waste buoyancy-${itemType.buoyancy} stage-${stage.tone} ${item.isNew ? "is-entering" : ""}" style="left:${item.left}%;bottom:${item.bottom}%;width:${item.size}px;height:${item.size}px;animation-delay:${item.delay}s;--waste-rot:${item.rotation}deg;--waste-opacity:${opacity};z-index:${5 + (index % 3)}" aria-hidden="true">
            ${item.isNew ? '<span class="water-splash"></span>' : ""}
            ${wasteSvg(item.type)}
            ${stage.key === "microplastic" ? '<span class="microplastic-specks"><i></i><i></i><i></i></span>' : ""}
          </div>`;
        })
        .join("");

      const cardsHtml = WASTE_TYPES.map(
        (waste) => `<button class="waste-card ${selected.id === waste.id ? "is-selected" : ""}" type="button" data-waste-id="${waste.id}" aria-label="Pilih dan jatuhkan 5 ${waste.name} ke laut, ${waste.durationLabel}" style="--waste-color:${waste.color};--waste-tint:${waste.tint}">
          <span class="waste-card-icon">${wasteSvg(waste.id)}</span>
          <span class="waste-card-copy"><strong>${waste.name}</strong><small>${waste.material}</small></span>
          <span class="waste-duration">${waste.shortDuration}</span>
          <span class="waste-card-arrow" aria-hidden="true">${iconSvg("plus", 15)}</span>
        </button>`
      ).join("");

      const milestonesHtml = MILESTONES.map((mark) => {
        const isNear = Math.abs(state.simYears - mark.years) < (mark.years < 1 ? 0.08 : 2);
        return `<button type="button" class="milestone-chip ${isNear ? "is-active" : ""}" data-milestone-years="${mark.years}" data-milestone-label="${mark.label}" ${state.debris.length === 0 ? "disabled" : ""}>${mark.label}</button>`;
      }).join("");

      const speedsHtml = SPEED_OPTIONS.map(
        (opt) => `<button type="button" class="speed-pill ${state.speed === opt.value ? "is-active" : ""}" data-speed="${opt.value}" aria-pressed="${state.speed === opt.value}">${opt.label}</button>`
      ).join("");

      const comparisonHtml = WASTE_TYPES.map((waste) => {
        const targetTick = waste.durationYears > 500 ? 1000 : yearsToTick(waste.durationYears);
        const barWidth = Math.max(8, (targetTick / 1000) * 100);
        const decay = Math.min(1, state.simYears / waste.durationYears);
        const stage = getDecayStage(decay, waste);
        const isSelected = waste.id === state.selectedId;
        return `<button type="button" class="comparison-row ${isSelected ? "is-selected" : ""}" data-select-id="${waste.id}" style="--waste-color:${waste.color};--waste-tint:${waste.tint}">
          <span class="comparison-item">
            <span class="comparison-thumb">${wasteSvg(waste.id)}</span>
            <span class="comparison-copy"><strong>${waste.name}</strong><small>${waste.durationLabel}</small></span>
          </span>
          <span class="comparison-bar-track" aria-hidden="true">
            <span class="comparison-bar-fill" style="width:${barWidth}%"></span>
            <span class="comparison-bar-marker" style="left:${Math.min(100, (sliderTick / 1000) * 100)}%"></span>
          </span>
          <span class="stage-pill stage-${stage.tone}">${stage.label}</span>
        </button>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <main class="app-shell">
          <header class="topbar">
            <a class="brand" href="#top" aria-label="Ocean Time, beranda">
              <span class="brand-mark">${iconSvg("wave", 26)}</span>
              <span class="brand-copy">
                <span class="brand-name">ocean<span>time</span></span>
                <span class="brand-caption">LABORATORIUM LAUT</span>
              </span>
            </a>
            <div class="topbar-actions">
              <span class="topbar-label"><span class="status-dot"></span> SIMULASI INTERAKTIF</span>
              <button class="icon-button sound-button ${state.soundEnabled ? "is-on" : ""}" id="btn-sound" type="button" aria-label="${state.soundEnabled ? "Matikan suara ombak" : "Nyalakan suara ombak"}" aria-pressed="${state.soundEnabled}">
                ${iconSvg(state.soundEnabled ? "sound" : "soundOff")}
              </button>
              <button class="reset-button" id="btn-reset" type="button">
                ${iconSvg("reset", 16)}
                <span>Atur ulang</span>
              </button>
            </div>
          </header>

          <section class="intro" id="top" aria-labelledby="page-title">
            <div class="intro-copy">
              <p class="eyebrow"><span class="eyebrow-line"></span> MISI EKOLOGI <span class="eyebrow-number">01</span></p>
              <h1 id="page-title">Sampah di laut,<br class="desktop-break" /> <span>ceritanya panjang.</span></h1>
              <p class="intro-description">Jatuhkan berbagai jenis sampah ke laut, lalu percepat waktu hingga 500 tahun untuk melihat mana yang cepat hancur dan mana yang bertahan.</p>
            </div>
            <div class="intro-stamp" aria-label="Fokus pembelajaran: waktu urai sampah">
              <span class="stamp-top">FOKUS HARI INI</span>
              <span class="stamp-bottom">${iconSvg("leaf", 16)} WAKTU URAI SAMPAH</span>
            </div>
          </section>

          <div class="workspace">
            <section class="simulation-panel panel" aria-labelledby="scene-heading">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">RUANG SIMULASI</p>
                  <h2 id="scene-heading">Teluk kecil</h2>
                </div>
                <div class="scene-heading-actions">
                  <div class="scene-live ${state.isRunning ? "is-active" : ""}">
                    <span class="live-pulse"></span> ${state.isRunning ? "BERJALAN" : "SIAP"}
                  </div>
                  <button class="narrate-button ${state.speakingId === "intro" ? "is-speaking" : ""}" id="btn-narrate-intro" type="button" aria-label="Dengarkan pengantar simulasi" aria-pressed="${state.speakingId === "intro"}">
                    ${iconSvg("sound", 18)}
                  </button>
                  <button class="expand-button" id="btn-expand" type="button" aria-label="Perbesar simulasi">
                    ${iconSvg(state.isFullscreen ? "shrink" : "expand", 17)}
                  </button>
                </div>
              </div>

              <div id="ocean-scene" class="ocean-scene ${isNight ? "is-night" : ""} ${isTwilight ? "is-twilight" : ""} ${state.isRunning ? "is-playing" : ""}" style="--pollution-level:${pollutionLevel}" aria-label="Pemandangan laut">
                <div class="scene-sky"></div>
                <div class="scene-sun-glow" style="left:${sunLeft}%;top:${sunTop}%"></div>
                <div class="celestial-body" style="left:${sunLeft}%;top:${sunTop}%" aria-hidden="true">
                  ${isNight ? moonSvg : '<span class="sun-rays"></span>'}
                </div>
                <div class="scene-cloud scene-cloud-one" aria-hidden="true"></div>
                <div class="scene-cloud scene-cloud-two" aria-hidden="true"></div>
                <div class="scene-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <div class="far-shore" aria-hidden="true"></div>
                <div class="scene-water">
                  <div class="water-caustics" aria-hidden="true"></div>
                  <div class="water-glimmer water-glimmer-one"></div>
                  <div class="water-glimmer water-glimmer-two"></div>
                  <div class="water-wave wave-one"></div>
                  <div class="water-wave wave-two"></div>
                  <div class="water-bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                </div>
                <div class="scene-depth" aria-hidden="true"></div>
                <div class="sea-floor" aria-hidden="true"></div>
                <div class="coral-reef" aria-hidden="true"><i></i><i></i><i></i></div>
                <div class="seaweed seaweed-left" aria-hidden="true"><i></i><i></i><i></i></div>
                <div class="seaweed seaweed-right" aria-hidden="true"><i></i><i></i><i></i></div>
                ${fishSvg("scene-fish scene-fish-one")}
                ${fishSvg("scene-fish scene-fish-two")}

                <div class="scene-time-card">
                  <span class="scene-time-label">WAKTU BERJALAN</span>
                  <div class="flip-clock" aria-label="Waktu simulasi: ${formattedTime.value} ${formattedTime.longUnit}">
                    <div class="flip-digits">${digitsHtml}</div>
                    <span class="flip-unit">${formattedTime.unit}</span>
                  </div>
                  <span class="scene-time-progress"><i style="width:${timelineProgress}%"></i></span>
                </div>

                <div class="scene-phase-pill">
                  ${iconSvg(isNight ? "moon" : "sun", 15)}
                  <span>${isNight ? "MALAM TENANG" : isTwilight ? "SENJA" : "SIANG CERAH"}</span>
                </div>

                <div class="scene-object-count">
                  <span class="count-dot"></span> ${state.debris.length}/${MAX_DEBRIS} BENDA
                </div>

                ${debrisHtml}

                ${
                  state.debris.length === 0
                    ? `<div class="scene-empty-prompt"><span class="prompt-spark">${iconSvg("plus", 15)}</span><span>Pilih sampah untuk<br />menjatuhkannya ke laut</span></div>`
                    : ""
                }

                <div class="scene-caption"><span>LAUT TERBUKA</span><i></i> TELUK NUSANTARA</div>
              </div>

              <div class="timeline-controls">
                <div class="timeline-topline">
                  <div class="timeline-label-group">
                    <span class="timeline-icon">${iconSvg("wave", 17)}</span>
                    <div>
                      <p class="section-kicker">PERCEPAT WAKTU</p>
                      <span class="timeline-readout">${formattedTime.prefix} <strong>${formattedTime.value}</strong> <small>${formattedTime.longUnit}</small></span>
                    </div>
                  </div>
                  <div class="timeline-actions">
                    <div class="speed-group" role="group" aria-label="Kecepatan simulasi">${speedsHtml}</div>
                    <button class="play-button ${state.isRunning ? "is-running" : ""} ${state.debris.length === 0 ? "is-idle" : ""}" id="btn-play" type="button" aria-pressed="${state.isRunning}">
                      ${iconSvg(state.isRunning ? "pause" : "play", 17)}
                      <span>${state.isRunning ? "Jeda waktu" : hasReachedEnd ? "Ulangi" : "Putar waktu"}</span>
                    </button>
                  </div>
                </div>

                <p class="status-notice" role="status" aria-live="polite">${state.notice}</p>

                <label class="range-label" for="time-range">Geser garis waktu atau pilih lompatan waktu</label>
                <input class="time-range" id="time-range" type="range" min="0" max="${MAX_TICK}" step="1" ${state.debris.length === 0 ? "disabled" : ""} value="${Math.round(sliderTick)}" />
                <div class="milestone-row" role="group" aria-label="Lompat ke tonggak waktu">${milestonesHtml}</div>
              </div>
            </section>

            <aside class="controls-panel panel" aria-labelledby="waste-heading">
              <div class="controls-heading">
                <p class="section-kicker">TENTUKAN OBJEKNYA</p>
                <h2 id="waste-heading">Apa yang masuk <br />ke laut?</h2>
                <p>Ketuk benda untuk menjatuhkan 5 sekaligus ke laut.</p>
              </div>

              <div class="waste-list" role="group" aria-label="Jenis sampah untuk simulasi">${cardsHtml}</div>

              <div class="lifespan-card">
                <div class="lifespan-card-top">
                  <span>PERKIRAAN WAKTU URAI</span>
                  <div class="lifespan-actions">
                    <button class="narrate-button fact-narrate ${state.speakingId === "fact" ? "is-speaking" : ""}" id="btn-narrate-fact" type="button" aria-label="Dengarkan fakta sampah terpilih" aria-pressed="${state.speakingId === "fact"}">
                      ${iconSvg("sound", 16)}
                    </button>
                    <span class="lifespan-mark">${iconSvg("leaf", 15)}</span>
                  </div>
                </div>
                <div class="lifespan-headline">
                  <strong>${selected.durationLabel}</strong>
                  ${selectedItems.length > 0 ? `<span class="stage-pill stage-${selectedStage.tone}">${selectedStage.label}</span>` : ""}
                </div>
                <p>${insightText}</p>
                <div class="lifespan-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(selectedDecay * 100)}">
                  <span style="width:${Math.round(selectedDecay * 100)}%"></span>
                </div>
                <div class="lifespan-progress-caption">
                  <span>Status di laut</span>
                  <span>${Math.round(selectedDecay * 100)}%</span>
                </div>
              </div>

              <button class="add-button" id="btn-add" type="button" ${state.debris.length >= MAX_DEBRIS ? "disabled" : ""}>
                <span class="add-button-icon">${iconSvg("plus", 17)}</span>
                <span>${state.debris.length >= MAX_DEBRIS ? `Laut penuh (${MAX_DEBRIS}/${MAX_DEBRIS})` : `Tambah 5 ${selected.name.toLowerCase()} lagi`}</span>
                ${iconSvg("arrow", 17)}
              </button>
              <p class="selection-hint"><span class="hint-dot"></span> ${matchingCount} ${selected.name.toLowerCase()} di laut saat ini</p>
            </aside>
          </div>

          <section class="comparison-board panel" aria-labelledby="comparison-heading">
            <div class="comparison-header">
              <div>
                <p class="section-kicker">PAPAN INFORMASI SAMPAH TERURAI</p>
                <h2 id="comparison-heading">Perbandingan waktu urai di laut</h2>
              </div>
              <div class="comparison-scale-legend" aria-hidden="true">
                <span>0</span><span>3 bln</span><span>20 thn</span><span>100 thn</span><span>500+ thn</span>
              </div>
            </div>
            <div class="comparison-list">${comparisonHtml}</div>
          </section>

          <footer class="site-footer">
            <span>OCEAN TIME <i></i> BELAJAR DARI LAUT</span>
            <span class="footer-motto">Laut bersih dimulai dari pilihan kecil.</span>
          </footer>
        </main>
      `;

      bindEvents(insightText, selected);
    }

    function addWaste(waste) {
      state.selectedId = waste.id;
      const amount = Math.min(5, MAX_DEBRIS - state.debris.length);
      if (amount <= 0) {
        state.notice = `Laut sudah penuh (${MAX_DEBRIS}/${MAX_DEBRIS}). Atur ulang untuk mengulang.`;
        render();
        return;
      }
      const pool = ZONE_POSITIONS[waste.buoyancy] || ZONE_POSITIONS.midwater;
      const offset = state.debris.length;
      for (let i = 0; i < amount; i += 1) {
        const slot = pool[(offset + i) % pool.length];
        const jitterLeft = ((offset + i) % 3 - 1) * 2.2;
        const jitterBottom = ((offset + i) % 2 === 0 ? 1 : -1) * 1.5;
        state.debris.push({
          id: `waste-${++state.nextId}`,
          type: waste.id,
          addedAtYears: state.simYears,
          left: Math.max(8, Math.min(90, slot.left + jitterLeft)),
          bottom: Math.max(12, Math.min(57, slot.bottom + jitterBottom)),
          rotation: slot.rotation,
          size: 44 + ((offset + i) % 3) * 5,
          delay: ((offset + i) % 6) * -0.45,
          isNew: true,
        });
      }
      state.notice = `${amount} ${waste.name.toLowerCase()} dijatuhkan ke laut.`;
      render();
      if (state.splashTimeout) clearTimeout(state.splashTimeout);
      state.splashTimeout = setTimeout(() => {
        state.debris.forEach((item) => (item.isNew = false));
        render();
      }, 780);
    }

    function startLoop() {
      cancelAnimationFrame(state.rafId);
      let lastFrame = performance.now();
      let lastCommit = lastFrame;
      function step(now) {
        if (!state.isRunning) return;
        const dt = Math.min(50, now - lastFrame);
        lastFrame = now;
        const currentTick = yearsToTick(state.simYears);
        const nextTick = Math.min(MAX_TICK, currentTick + (dt / 1000) * 55 * state.speed);
        state.simYears = tickToYears(nextTick);
        if (nextTick >= MAX_TICK) {
          state.simYears = MAX_SIM_YEARS;
          state.isRunning = false;
          state.notice = "Simulasi mencapai 500 tahun. Lihat perbandingan sampah yang masih bertahan!";
          render();
          return;
        }
        if (now - lastCommit >= 65) {
          lastCommit = now;
          render();
        }
        state.rafId = requestAnimationFrame(step);
      }
      state.rafId = requestAnimationFrame(step);
    }

    function toggleTime() {
      if (state.isRunning) {
        state.isRunning = false;
        cancelAnimationFrame(state.rafId);
        state.notice = "Waktu dijeda.";
        render();
        return;
      }
      if (state.debris.length === 0) {
        state.notice = "Pilih jenis sampah terlebih dahulu untuk menjatuhkannya ke laut.";
        render();
        return;
      }
      if (state.simYears >= MAX_SIM_YEARS) state.simYears = 0;
      state.isRunning = true;
      state.notice = `Waktu berjalan (${state.speed}x). Amati perubahan siang, malam, dan kondisi sampah.`;
      render();
      startLoop();
    }

    function speak(text, id) {
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        state.notice = "Fitur narasi belum tersedia di browser ini.";
        render();
        return;
      }
      if (state.speakingId === id) {
        state.speechToken += 1;
        window.speechSynthesis.cancel();
        state.speakingId = null;
        render();
        return;
      }
      const token = ++state.speechToken;
      window.speechSynthesis.cancel();
      const utterance = new window.SpeechSynthesisUtterance(text);
      utterance.lang = "id-ID";
      utterance.rate = 0.94;
      state.speakingId = id;
      render();
      utterance.onend = () => {
        if (state.speechToken === token) {
          state.speakingId = null;
          render();
        }
      };
      utterance.onerror = () => {
        if (state.speechToken === token) {
          state.speakingId = null;
          render();
        }
      };
      window.speechSynthesis.speak(utterance);
    }

    async function toggleSound() {
      const session = ++state.audioSession;
      if (state.fadeTimeout) {
        clearTimeout(state.fadeTimeout);
        state.fadeTimeout = null;
      }
      if (state.soundEnabled) {
        const { context, source, gain } = state.audio;
        if (context && context.state !== "closed" && gain) {
          gain.gain.setTargetAtTime(0, context.currentTime, 0.12);
          state.fadeTimeout = setTimeout(() => {
            if (source && context.state !== "closed") { try { source.stop(); } catch {} }
            if (context.state !== "closed") context.close().catch(() => {});
            if (state.audioSession === session) state.audio = { context: null, source: null, gain: null };
          }, 480);
        }
        state.soundEnabled = false;
        state.notice = "Suara ombak dimatikan.";
        render();
        return;
      }
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("Suara ombak tidak tersedia di browser ini.");
        const context = new AudioContextClass();
        await context.resume();
        if (state.audioSession !== session) {
          context.close().catch(() => {});
          return;
        }
        const buffer = context.createBuffer(1, context.sampleRate * 3, context.sampleRate);
        const samples = buffer.getChannelData(0);
        for (let i = 0; i < samples.length; i += 1) samples[i] = (Math.random() * 2 - 1) * 0.22;
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        const lowPass = context.createBiquadFilter();
        lowPass.type = "lowpass";
        lowPass.frequency.value = 420;
        const gain = context.createGain();
        gain.gain.setValueAtTime(0, context.currentTime);
        gain.gain.linearRampToValueAtTime(0.045, context.currentTime + 0.7);
        source.connect(lowPass).connect(gain).connect(context.destination);
        source.start();
        state.audio = { context, source, gain };
        state.soundEnabled = true;
        state.notice = "Suara ombak diaktifkan.";
        render();
      } catch (e) {
        state.notice = e.message || "Suara tidak dapat diputar.";
        render();
      }
    }

    function bindEvents(insightText, selected) {
      document.getElementById("btn-sound")?.addEventListener("click", toggleSound);
      document.getElementById("btn-reset")?.addEventListener("click", () => {
        state.isRunning = false;
        cancelAnimationFrame(state.rafId);
        state.selectedId = "bottle";
        state.simYears = 0;
        state.debris = [];
        state.speechToken += 1;
        window.speechSynthesis?.cancel?.();
        state.speakingId = null;
        state.notice = "Simulasi diatur ulang. Laut kembali bersih.";
        render();
      });
      document.getElementById("btn-play")?.addEventListener("click", toggleTime);
      document.getElementById("btn-add")?.addEventListener("click", () => addWaste(selected));
      document.getElementById("btn-narrate-intro")?.addEventListener("click", () =>
        speak("Sampah di laut butuh waktu yang berbeda untuk terurai. Pilih jenis sampah untuk menjatuhkannya ke laut, lalu putar waktu hingga lima ratus tahun.", "intro")
      );
      document.getElementById("btn-narrate-fact")?.addEventListener("click", () => speak(insightText, "fact"));
      document.getElementById("btn-expand")?.addEventListener("click", async () => {
        const scene = document.getElementById("ocean-scene");
        try {
          if (document.fullscreenElement) await document.exitFullscreen?.();
          else if (scene?.requestFullscreen) await scene.requestFullscreen();
        } catch {}
      });
      document.getElementById("time-range")?.addEventListener("input", (e) => {
        state.isRunning = false;
        cancelAnimationFrame(state.rafId);
        state.simYears = tickToYears(Number(e.target.value));
        const fmt = formatSimTime(state.simYears);
        state.notice = `Waktu diatur ke ${fmt.value} ${fmt.longUnit}.`;
        render();
      });
      document.querySelectorAll("[data-waste-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const w = WASTE_TYPES.find((item) => item.id === btn.getAttribute("data-waste-id"));
          if (w) addWaste(w);
        });
      });
      document.querySelectorAll("[data-select-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedId = btn.getAttribute("data-select-id");
          render();
        });
      });
      document.querySelectorAll("[data-speed]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.speed = Number(btn.getAttribute("data-speed"));
          render();
        });
      });
      document.querySelectorAll("[data-milestone-years]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.isRunning = false;
          cancelAnimationFrame(state.rafId);
          state.simYears = Number(btn.getAttribute("data-milestone-years"));
          const label = btn.getAttribute("data-milestone-label");
          state.notice = `Waktu dilompatkan ke ${label === "0" ? "awal (0)" : label}.`;
          render();
        });
      });
    }

    render();
  </script>
